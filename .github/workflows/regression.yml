name: GEO 整合层一键回归

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 说明：GitHub 账号(ganfeng321)曾因 billing 被锁定，云端 Actions 暂不可用。
# 等价验证改用本机 ci_check.ps1（跑 run_all.py --skip-real）。
# 待 GitHub 账号解锁后，本 workflow 可直接触发，无需改动。

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Debug env
        run: |
          echo "OS: $(uname -a)"
          echo "python: $(which python || echo none)"
          python3 --version || echo "no python3"
          echo "PWD: $PWD"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        working-directory: apps/geo-core
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install requests psutil --break-system-packages

      - name: Run acceptance (skip real publish)
        working-directory: apps/geo-core
        run: |
          python run_all.py --skip-real --only F8 F12 F13 F19 F7B

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-logs
          path: |
            apps/geo-core/dashboard.log
            apps/geo-core/dashboard.err
