name: GEO 整合层一键回归

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        working-directory: apps/geo-core
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install requests psutil --break-system-packages

      - name: Run acceptance (skip real publish)
        working-directory: apps/geo-core
        run: |
          python run_all.py --skip-real --only F8 F12 F13 F19 F7B

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-logs
          path: |
            apps/geo-core/dashboard.log
            apps/geo-core/dashboard.err
